[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data2doc2data"
version = "3.0.0"
description = "面向真实业务的数据与文本循环推理架构。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Data2Doc2Data contributors" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6",
  "ruff>=0.9",
]

[project.urls]
Homepage = "https://github.com/BrunoBanana/data2doc2data"
Issues = "https://github.com/BrunoBanana/data2doc2data/issues"

[project.scripts]
data2doc2data = "data2doc2data.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
data2doc2data = [
  "sample/scenarios/*.json",
  "sample/scenarios/*/*.csv",
  "sample/scenarios/*/*.md",
  "sample/cases/*.json",
  "sample/cases/*/*.json",
  "sample/cases/*/*.csv",
  "sample/cases/*/documents/*.md",
  "integration_templates/*",
  "static/*",
  "static/dist/*",
  "static/dist/assets/*",
]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
source = ["src/data2doc2data", "scripts"]

[tool.coverage.report]
fail_under = 80
show_missing = true
